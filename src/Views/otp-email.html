<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GO Company OTP</title>
  </head>
  <body style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;">
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:20px;">
          <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:20px;">
            <tr>
              <td>
                <h2 style="color:#333;margin-bottom:10px;">GO Company</h2>
                <p style="color:#555;">Hello,</p>
                <p style="color:#555;">
                  You requested to reset your password. Please use the OTP below:
                </p>

                <div style="text-align:center;margin:30px 0;">
                  <span style="
                    display:inline-block;
                    font-size:28px;
                    letter-spacing:6px;
                    background:#f0f0f0;
                    padding:15px 25px;
                    border-radius:6px;
                    font-weight:bold;
                    color:#000;
                  ">
                    {{OTP}}
                  </span>
                </div>

                <p style="color:#777;">
                  This OTP is valid for <strong>5 minutes</strong> only.
                </p>

                <p style="color:#777;">
                  If you did not request this, please ignore this email.
                </p>

                <hr style="margin:30px 0;border:none;border-top:1px solid #eee;" />

                <p style="font-size:12px;color:#999;">
                  © 2026 GO Company. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
