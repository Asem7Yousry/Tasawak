services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    ports:
    - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pro-app
  pro-app:
    image: asemjj/tasawak:latest
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=myStrongPassword
    depends_on:
      - redis
    deploy:
      replicas: 3
  redis:
    image: redis 
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass myStrongPassword
