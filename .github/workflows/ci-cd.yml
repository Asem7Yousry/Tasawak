name: tasawak CI/CD Pipeline

on:
    push:
        branches:
            - docker

    # pull_request:
    #     branches:
    #         - main

jobs:
    # ci pipeline to test and build the code 
    test_and_build:
        runs-on: ubuntu-latest # difine the runner environment (virtual machine) to run the job on
        steps:
            - name: clone repository code
              uses: actions/checkout@v5 # checkout the repository to the runner environment

            - name: setup nodeJS
              uses: actions/setup-node@v4
              with: {node-version: 22, cache: 'npm'}

            - name: install dependencies
              run: npm install # install the dependencies defined in package.json

            # - name: test code 
            #   run: npm run test # run the tests defined in package.json

            # - name: build code
            #   run: npm run build # build the code defined in package.json

            # upload the source code as an artifact to be used in the deploy job
            - name: upload artifacts 
              uses: actions/upload-artifact@v4
              with:
                name: source-code
                path: |
                    src 
                    package.json 
                    package-lock.json
    
    # cd pipeline to deploy the code to the server
    deploy:
        runs-on: ubuntu-latest
        needs: test_and_build # this job will run after the test_and_build job is completed successfully
        steps:
            - name: download artifacts
              uses: actions/download-artifact@v4
              with:
                name: source-code
                path: ./ 

            - name: Deploy to Staging server
              uses: easingthemes/ssh-deploy@main
              with:
                    SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                    ARGS: "-rlgoDzvc --delete --exclude='docker/' --exclude='nginx/' -i"
                    SOURCE: "./"
                    REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
                    REMOTE_USER: ${{ secrets.REMOTE_USER }}
                    TARGET: ${{ secrets.REMOTE_TARGET }}
                    # EXCLUDE: "/dist/, /node_modules/"
                    



